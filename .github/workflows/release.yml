name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^version=' gradle.properties)" -eq 1
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$version"
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { section = 1 }
            section && /^## / && index($0, "## [" version "]") != 1 { exit }
            section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check build --no-parallel --stacktrace
      - name: Collect release files
        shell: pwsh
        run: ./scripts/build-release.ps1 -SkipBuild
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MineDriver ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: build/release/${{ steps.metadata.outputs.version }}/*
          fail_on_unmatched_files: true
